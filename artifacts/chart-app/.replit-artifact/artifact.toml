kind = "web"
previewPath = "/"
title = "Chart Evidence Analyzer"
version = "1.0.0"
id = "artifacts/chart-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22367

[services.development]
run = "pnpm --filter @workspace/chart-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chart-app", "run", "build" ]
publicDir = "artifacts/chart-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22367"
BASE_PATH = "/"
