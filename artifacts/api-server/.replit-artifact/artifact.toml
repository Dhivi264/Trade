kind = "api"
previewPath = "/"
title = "Chart Evidence Analyzer"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/"]

[services.development]
run = "uvicorn main:app --host 0.0.0.0 --port 8080 --app-dir ../../backend --reload --reload-dir ../../backend"

[services.production]

[services.production.build]
args = ["bash", "-lc", "cd ../../frontend && npm install --no-audit --no-fund && npm run build"]

[services.production.run]
args = ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8080", "--app-dir", "../../backend"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
